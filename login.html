<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Food Donation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center text-danger">Login</h2>
  <form id="loginForm" class="mx-auto mt-4" style="max-width: 400px;">
    <input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
    <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
    <button class="btn btn-danger w-100" type="submit">Login</button>
  </form>
  <p class="text-center mt-3">Don't have an account? <a href="register.html">Register here</a></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const formData = new FormData(this);

  fetch("login.php", {
    method: "POST",
    body: formData
  })
  .then(res => res.text())
  .then(role => {
    if (role.trim() === "donor") {
      window.location.href = "donor.html";
    } else if (role.trim() === "receiver") {
      window.location.href = "receiver.html";
    } else {
      alert("Login failed: " + role);
    }
  })
  .catch(err => {
    alert("Fetch error: " + err);
  });
});
</script>

</body>
</html>
