<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Food Donation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center text-danger">Register</h2>
  <form id="registerForm" class="mx-auto mt-4" style="max-width: 500px;" method="POST">
    <input class="form-control mb-3" name="name" placeholder="Full Name" required>
    <input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
    <input class="form-control mb-3" name="phone" placeholder="Phone" required>
    <input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
    <select class="form-control mb-3" name="role" required>
      <option value="">Register as...</option>
      <option value="donor">Donor</option>
      <option value="receiver">Receiver</option>
    </select>
    <button class="btn btn-danger w-100" type="submit">Register</button>
  </form>
  <p class="text-center mt-3">Already have an account? <a href="login.html">Login here</a></p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  fetch("register.php", {
    method: "POST",
    body: formData
  })
  .then(res => res.text())
  .then(response => {
    if (response.trim() === "success") {
      alert("Successfully registered! Redirecting to login...");
      window.location.href = "login.html";
    } else {
      alert("Registration failed: " + response);
    }
  })
  .catch(err => {
    alert("Fetch error: " + err);
  });
});
</script>

</body>
</html>
