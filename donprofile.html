<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donor Profile - Food Donation Platform</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      background-color: #e74c3c;
      color: white;
      text-align: center;
      padding: 20px;
      width: 100%;
    }

    header nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    header nav ul li {
      margin: 0 15px;
    }

    header nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 10px 20px;
      background-color: #c0392b;
      border-radius: 8px;
      transition: 0.3s;
    }

    header nav ul li a:hover {
      background-color: #e74c3c;
    }

    main {
      width: 80%;
      max-width: 800px;
      margin: 20px auto;
      background-color: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .profile-card {
      background-color: #f2dede;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    .profile-card h4 {
      font-size: 24px;
      color: #e74c3c;
      margin-bottom: 10px;
    }

    .btn-edit-profile {
      display: inline-block;
      background-color: #c0392b;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 15px;
      transition: 0.3s;
    }

    .btn-edit-profile:hover {
      background-color: #e74c3c;
    }

    .edit-profile-form {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .edit-profile-form input, .edit-profile-form button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .edit-profile-form input {
      width: 80%;
      max-width: 400px;
    }

    .edit-profile-form button {
      background-color: #c0392b;
      color: white;
      cursor: pointer;
    }

    .edit-profile-form button:hover {
      background-color: #e74c3c;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      padding: 15px;
      background-color: #e74c3c;
      color: white;
      width: 100%;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Food Donation Platform</h1>
    <nav>
      <ul>
        <li><a href="home.html">🏠 Home</a></li>
        <li><a href="donprofile.html">👤 Profile</a></li>
        <li><a href="donor.html">📦 Donor Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Donor Profile</h2>
    <div class="profile-card" id="profileCard">
      <h4 id="donorName">Name</h4>
      <p><strong>Email:</strong> <span id="donorEmail">email@example.com</span></p>
      <p><strong>Phone:</strong> <span id="donorPhone">123-456-7890</span></p>
      <p><strong>Location:</strong> <span id="donorLocation">City</span></p>
      <a href="javascript:void(0);" class="btn-edit-profile" onclick="showEditForm()">✏ Edit Profile</a>
    </div>

    <div class="edit-profile-form" id="editProfileForm">
      <h3>Edit Profile</h3>
      <input type="text" id="editName" placeholder="Name">
      <input type="email" id="editEmail" placeholder="Email">
      <input type="text" id="editPhone" placeholder="Phone">
      <input type="text" id="editLocation" placeholder="Location">
      <button onclick="updateProfile()">Update Profile</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Food Donation Platform</p>
  </footer>

  <script>
    // Load profile info from localStorage
    window.onload = function () {
      const donor = JSON.parse(localStorage.getItem("donor")) || {
        name: "Jane Smith",
        email: "janesmith@example.com",
        phone: "123-456-7890",
        location: "New York"
      };

      document.getElementById("donorName").textContent = donor.name;
      document.getElementById("donorEmail").textContent = donor.email;
      document.getElementById("donorPhone").textContent = donor.phone;
      document.getElementById("donorLocation").textContent = donor.location;

      document.getElementById("editName").value = donor.name;
      document.getElementById("editEmail").value = donor.email;
      document.getElementById("editPhone").value = donor.phone;
      document.getElementById("editLocation").value = donor.location;
    };

    function showEditForm() {
      document.getElementById('profileCard').style.display = 'none';
      document.getElementById('editProfileForm').style.display = 'flex';
    }

    function updateProfile() {
      const updatedDonor = {
        name: document.getElementById('editName').value,
        email: document.getElementById('editEmail').value,
        phone: document.getElementById('editPhone').value,
        location: document.getElementById('editLocation').value
      };

      localStorage.setItem("donor", JSON.stringify(updatedDonor));

      document.getElementById("donorName").textContent = updatedDonor.name;
      document.getElementById("donorEmail").textContent = updatedDonor.email;
      document.getElementById("donorPhone").textContent = updatedDonor.phone;
      document.getElementById("donorLocation").textContent = updatedDonor.location;

      document.getElementById('editProfileForm').style.display = 'none';
      document.getElementById('profileCard').style.display = 'block';
    }
  </script>
</body>
</html>
