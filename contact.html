<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Food Donation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #fffaf9;
    }
    .navbar-dark .navbar-nav .nav-link {
      color: white !important;
    }
    .contact-section {
      padding: 60px 0;
    }
    .contact-card {
      background-color: white;
      border: 2px solid black;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .contact-heading {
      background: black;
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 30px;
    }
    .contact-icon {
      font-size: 24px;
      margin-right: 10px;
      color: #dc3545;
    }
    .form-control:focus {
      border-color: #dc3545;
      box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger px-4">
    <a class="navbar-brand" href="home.html">Food Donation</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact Us</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contact Section -->
  <div class="container contact-section">
    <div class="contact-heading">
      <h2>Contact Us</h2>
      <p>We’re here to help you make a difference</p>
    </div>
    <div class="row justify-content-center">
      <!-- Contact Info -->
      <div class="col-md-6 mb-4">
        <div class="contact-card">
          <h4><i class="bi bi-envelope-fill contact-icon"></i>Email</h4>
          <p>HungerZeroHub@gmail.com</p>

          <h4><i class="bi bi-telephone-fill contact-icon"></i>Phone</h4>
          <p>+91 8309514528</p>

          <h4><i class="bi bi-geo-alt-fill contact-icon"></i>Address</h4>
          <p>123 Food Donation Street, Jangaon,India</p>

          <h4><i class="bi bi-share-fill contact-icon"></i>Follow Us</h4>
          <p>
            <a href="#" class="text-danger me-2"><i class="bi bi-facebook"></i></a>
            <a href="#" class="text-danger me-2"><i class="bi bi-twitter"></i></a>
            <a href="#" class="text-danger"><i class="bi bi-instagram"></i></a>
          </p>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="col-md-6 mb-4">
        <div class="contact-card">
          <h4><i class="bi bi-chat-dots-fill contact-icon"></i>Send us a message</h4>
          <form onsubmit="sendMessageToWhatsApp(event)">
            <div class="mb-3">
              <label for="name" class="form-label">Your Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Your Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Your message here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-danger w-100">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Food Donation Initiative. All Rights Reserved.</p>
  </footer>

  <!-- WhatsApp Script -->
  <script>
    function sendMessageToWhatsApp(event) {
      event.preventDefault(); // Prevent page refresh

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      const phoneNumber = '+918309514528'; // ✅ Replace with your WhatsApp number (without '+' or spaces)

      const fullMessage = `Hello! My name is ${name}.\nEmail: ${email}\nMessage: ${message}`;
      const encodedMessage = encodeURIComponent(fullMessage);

      const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

      window.open(whatsappURL, '_blank');
    }
  </script>

</body>
</html>
